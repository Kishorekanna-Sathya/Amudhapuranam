services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./app/frontend:/app          # live source mount for hot-reload
      - frontend_node_modules:/app/node_modules  # keep container's node_modules isolated
    ports:
      - "3000:3000"
    environment:
      - VITE_BASE=/                  # serve at root (no sub-path), avoids 404s locally
      - CHOKIDAR_USEPOLLING=true     # needed for file-watch to work inside Docker on some OSes
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"
    restart: unless-stopped

volumes:
  frontend_node_modules:

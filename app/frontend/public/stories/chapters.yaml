    content: |
      என் பத்தாம் வகுப்புப் பொதுத்தேர்வு நெருங்கிக்கொண்டிருந்த காலகட்டம் அது. பன்னிரண்டாம் வகுப்பு பொதுத் தேர்வு எழுதுவோருக்கு இல்லாத ஒரு படபடப்பு பத்தாம் வகுப்பு எழுதுவோருக்கு இருக்கும், ஏனெனில் முதல் முறையாக பொதுத் தேர்வினை சந்திக்கும் பயம் ஆகும். பந்தயத்திற்குத் தயாராகும் குதிரைகளைப் போல எங்களை மண்டை மண்டையாக அடித்து தயார் படுத்தி வந்தது பள்ளி நிர்வாகம். சமயங்களில் ஆசிரியர்களின் பொறுமையை சோதிக்கும் அளவிற்கு இருந்தது எங்களின் சேட்டைகளும் மதிப்பெண்களும். அப்படிப்பட்ட சூழ்நிலையில் ஆசிரியர்களின் கோபத்திற்கு உட்படாத ஒருத்தி இருந்தாள் – பல்லவி. பித்தாகரஸ் தியரம், திப்பு சுல்தான் போர், செம்பருத்தியின் மகரந்தச் சேர்க்கை, ட்ரிக்னாமெட்ரி அளவீடுகள், உயிர்வரின் உக்குறள் மெய்விட்டு ஓடும் என அனைத்தையும் நன்கு படித்தவளாக மட்டுமில்லாமல், அதை சக மாணவ மாணவியர்களுக்கு எளிதாகச் சொல்லி கொடுக்கும் பக்குவம் உள்ளவளாக இருந்தாள். இதன் காரணமாக சில ஆசிரியர்கள் பொறாமை கொண்டதும் இருந்தது, பலர் பெருமை கொண்டதும் இருந்தது. எவரிடம் பேசினாலும் கள்ளங்கபடம் இல்லாத, வாய்நிறையச் சிரிப்புடன் கூடிய அவளது வெளிப்படைத்தன்மையும் அனைவரின் பிடித்தத்திற்கு காரணமாக இருந்தது. அந்தச் சிறு வயதிலேயே மிகத் தெளிவான சிந்தனையைக் கொண்டிருந்தாள் அவள். அவள் ஆசையை வளர்த்து இறந்த நாயின் முடியில் மோதிரம் செய்து அணிந்திருப்பாள்.  அவளுக்கென்று தனித்த நெருங்கிய நண்பர்கள் வட்டம் ஏதுமில்லை; ஆனால், அத்தனை பேருமே அவளுக்குத் நண்பர்கள். நான் பல்லவியிடம் பழகத் துவங்கியது எப்படி என்றால், அன்று செய்முறைத் தேர்வுக்காக அனைவரும் மும்முரமாக ‘ரெக்கார்டு நோட்’ எழுதிக்கொண்டிருந்தோம். என் கையெழுத்தோ படுமோசம். ‘நீ எழுதிய வரிகள் மீது நடந்தால் இமயமலை உச்சியைத் தொட்டுவிடலாம்’ என்று கேலி செய்து, ஆசிரியர்கள் என் விரல்களைப் பலமுறை பிரம்பால் பதம் பார்த்திருக்கிறார்கள். அந்தப் பயத்தில்தான் பொதுத்தேர்வைச் சந்திக்கப்போகும் நடுக்கத்துடன் பல்லவியிடம் ஒரு கோரிக்கையை வைத்தேன். அவள் எனக்கு ரெக்கார்டு நோட் எழுதித் தர வேண்டும், அதற்குப் பதிலாக அவளது நோட்டில் நான் படம் வரைந்து தருவேன் என்பதே அது. அவளும் சம்மதித்தாள். அப்படியாகவே இருந்தது எனக்கும் பல்லவிக்குமான நட்பு பாராட்டலின் துவக்கம். என்னுடனேயே எப்பொழுதும் இருக்கும் வாசு, பல்லவி பேசும் தருணங்களிலெல்லாம் அருகிலிருப்பான் - ஆனால், வாய் திறக்க மாட்டான். ஒருநாள் பல்லவி என்னிடம் உரையாடிக்கொண்டிருக்கையில், தற்செயலாக என் பார்வை வாசுவின் மேல் விழுந்தது. அவனது கண்களில் ஒரு மின்னல் மிதந்தது - அது எனக்குப் நன்கு பரிச்சயப்பட்ட பார்வை. வள்ளியை பார்க்கும் தருணங்களில் என் கண்கள் எப்படி இருந்தனவோ, அதேபோல் இருந்தது வாசுவின் பார்வை. நான் ஒருகாலத்தில் வள்ளியைப் பற்றி வார்த்தைகளைத் தேடி திக்கித் திணறியதுபோலவே, அன்று அவனும் தடுமாறிய பல்லவி தனக்குப் பிடித்திருப்பதாக மெல்லச் சொன்னான். பல்லவியை எந்த மாணவனும் காதலிப்பதாக நான் கேள்விப்பட்டதில்லை; அவளும் வேறு யாரையேனும் காதலிப்பதாகவும் தெரியவில்லை. ஆனால், அவளும் பெண்தானே, அவளுக்கும் இதுபோன்ற ஆசை ஏன் வரக்கூடாது? ஆகையால், நான் வாசுவை முழு மனதுடன் வாழ்த்தினேன். 
      இந்த உரையாடல் நடந்த ஓரிரு நாட்களிலேயே பல்லவி பள்ளிக்கு வருவதை நிறுத்திக்கொண்டாள். பொதுத்தேர்வு நெருங்கும் நேரத்தில் விடுப்பு எடுக்க வேண்டிய அவசியம் என்னவென்று யாருக்கும் புரியவில்லை. மூன்றாம் நாளும் அவள் வராததால், வாசு காரணம் கேட்டு என்னை வாட்டி எடுக்கத் தொடங்கினான். அவனது தொல்லை தாங்காமல் நான் ஆசிரியரிடம் சென்று விசாரித்தேன். "அவ வராத காரணத்தை தெரிஞ்சுட்டு, அத தான் நீ தேர்வுல எழுதப் போகிறாயா?" என்று அவர் கடிந்துகொண்டதால் வாயடைத்துத் திரும்பினேன். ஒருவேளை அவளுக்கு சடங்கு ஆகியிருக்கலாம், அதனால்தான் பள்ளிக்கு வரவில்லை என்று வாசுவிடம் கூறி அவனைச் சமாதானப்படுத்தினேன். 

      மறுநாள் காலை பல்லவியின் அப்பா இறந்துவிட்டார் என்ற துக்கச் செய்தி வந்தது. பல்லவியை நினைத்து பரிதாபப்பட்டேன். இறப்பு வீட்டிற்குச் செல்ல வேண்டும் என்று தோன்றியது. நாங்கள் ஐந்தாறு பேர் சென்று தலைமை ஆசிரியரிடம் அரைநாள் விடுப்பிற்கான அனுமதி கேட்டு பல்லவி வீட்டிற்குச் சென்றோம். இரங்கல் வீட்டில் கட்டப்படும் பந்தல், ரோஜா பூக்களின் நாசியைத் துளைக்கும் நெடி, பூக்களுடன் சேர்த்து இறந்தவரையும் மொய்த்துக்கொள்ள வரும் ஈக்கூட்டம், இவையெல்லாம் இல்லாமல் அந்த வீடு மிகவும் சாதாரணமாகவே இருந்தது. பல்லவியின் பெற்றோர் வீட்டை எதிர்த்துக் காதல் திருமணம் செய்துகொண்டதால், உறவினர்களுடன் எந்தப் போக்குவரத்தும் இல்லாமல் இத்தனை காலமும் தனித்தே வாழ்ந்திருக்கிறார்கள். இரங்கல் செய்தி கேட்டு பத்திருபது உறவினர்கள் மட்டுமே அங்கு வந்திருந்தனர். அதுவும் போக அக்கம்பக்கத்தினர் என்று கூட்டம் குறைந்தே இருந்தது. பல்லவி முற்றிலுமாக உடைந்து போயிருந்தாள். மூன்று நாட்களுக்கு முன் சாலை விபத்தில் சிக்கிய அவர், சிகிச்சை பலனின்றி உயிரிழந்திருக்கிறார். உடற்கூறு ஆய்வின் காரணமாக இன்னும் சடலம் வீட்டிற்கு கொண்டு வரப்படவில்லை. தாமதமாகும் என்று எதிர்பார்க்கப்பட்டது. ஒரு இரங்கல் வீட்டில் சடலம் இல்லாது, வெறும் நினைவுகளின் மீது தழுவி அழுது ஒப்பாரி வைக்கும் துயரை எதைக்கொண்டும் ஈடுகட்ட முடியாது. 

      சாயிங்களம் போல சடலம் ஆம்புலன்சில் கொண்டு வர பட்டது. ஆய்வு செய்த சடலம் என்பதால் பல்லவியாலும் அவளின் தாயராலும் அவரை கட்டி தள்ளுவி அழ முடியவில்லை. தொட்டும் தொடாமலும் தங்களின் துன்பத்தை அளவீடு செய்தே வெளியிட்டது போல சிரமப்பட்டனர். உள் உறுப்புகளை களைந்து தையல்களால் பூட்டி வைத்திருந்த சடலத்தை போல என் இதயத்தை களைந்து வெளியே வைத்து இந்த துன்பங்களை எல்லாம் பார்த்துக் கொண்டிருந்தேன். பெரிய சடங்குகளைச் செய்ய இயலாத நிலையில், தங்களால் இயன்ற சிலவற்றை மட்டும் செய்தார்கள். சடங்குகளின் இறுதியாக, பல்லவியின் தாயாரை அழைத்துத் தாலியை அறுக்கத் தயாராகினர். அப்போதுதான் வெளிப்பட்டது, அம்மாவின் கழுத்தில் தாலி இல்லை! காலையிலிருந்து யாருமே அதைக் கவனிக்கவில்லை. உறவினர்கள் ஆக்ரோஷமாக அவரிடம் கேள்வி எழுப்பினர். இரண்டு நாட்களுக்கு முன் சிகிச்சைக்காகத் தாலியை விற்றுப் பணம் செலுத்தியதாகவும், அந்தப் பதற்றத்தில் மாற்றுச் சரடு அணிய மறந்துவிட்டதாகவும் அவர் கண்ணீருடன் கூறினார். அதை ஏற்காத உறவினர்கள், கோபத்துடன் அருகிலிருந்த கடையில் ஒரு மஞ்சள் கயிற்றை வாங்கி வரச் செய்து, அதை அவள் கழுத்தில் கட்டச் சொல்லி, பின் அதை அறுத்தெடுத்தனர். இதுபோன்ற குரூரமான நிகழ்வுகளைப் பார்க்கையில்தான், இந்தச் சமூகத்தின் மீதான என் கோபம் தணலாய் எரிகிறது. இந்தச் சமூகத்தில் பெண்கள் மீதான பார்வை எவ்வளவு குருட்டுத்தனமானது என்பது அப்போதுதான் எனக்குத் திரையிலிட்டது போல் விளங்கியது. பெண்கள் எப்படிப்பட்ட இக்கட்டான நிலையில் இருந்தாலும் கண்டுகொள்ளாத சமூகம், தனக்கான தேவைகளும் சடங்கு சம்பிரதாயங்கள் என வரும்போது மட்டும் அவளது தாலியையும், மெட்டியையும், கருமணி, புர்காவையும், சேலையும் அந்த சேலையில் குத்தியுள்ள பின்னூசியையும்கூடத் துருவித் துருவிப் பார்க்கிறது.

      நான்கைந்து நாட்கள் கழித்து பள்ளித் தாளாளர் வந்து ஓர் அறிவிப்பை வெளியிட்டார்: "வரவிருக்கும் பொதுத்தேர்வில் 98% மேல் மதிப்பெண் பெறுபவர்களின் 11 மற்றும் 12ஆம் வகுப்பிற்கான முழு கல்விக் கட்டணத்தையும் பள்ளியே ஏற்கும்." இதைக் கேட்டவுடன் எப்படியாவது இதை பல்லவியிடம் தெரிவிக்க வேண்டும் என்று வாசு நினைத்தான், அதன்படியே அன்று பள்ளி முடிந்ததும் நாங்கள் இருவரும் பல்லவி வீட்டிற்குச் சென்றோம். பல்லவியின் அம்மா வீட்டில் இருந்திருக்கவில்லை, வெளியே ஒரு வேலையாகப் போயிருந்தார் போலும். பல்லவியைப் பார்த்து நலம் விசாரித்துத் தகவல் தெரிவித்தோம். அவளுக்கு முன்னமே இது தெரிந்திருக்கிறது, சொல்லப் போனால் பல்லவிக்காகத்தான் இந்த சலுகை. ஆம், பல்லவியின் அம்மா பள்ளிக்கு வந்து அவளை அடுத்த வருடம் வேறு பள்ளிக்கு மாற்ற விருப்பமாக கூறினார், கட்டணம் செலுத்த இயலாதது காரணம் என்பதால். பள்ளி நிர்வாகத்திற்கு அவளை வெளியே அனுப்ப மனம் இல்லை. அதனால் அவளுக்கும் உதவி செய்யும் பொருட்டு, பள்ளி நிர்வாகம் இந்த முடிவை எடுத்துள்ளது. அது மட்டுமல்லாது இதன் மூலம் வேறு எந்த குழந்தைக்கும் பாரபட்சம் காட்டுவது போல் இருக்காது. இதை அவள் சொல்லி தெரிந்தோம், மகிழ்ச்சியும் கொண்டோம். அதன்பின் அவளின் தந்தையைப் பற்றிக் கேட்டுத் தெரிந்துகொண்டோம். அப்போது பல்லவி சொன்ன செய்தி எங்களைப் பதபதைக்க வைத்தது.

      அவளது தந்தை மட்டுமே கூலி வேலைக்குச் சென்று குடும்பத்தைக் காப்பாற்றியிருக்கிறார். பெரிதாக எந்தச் சேமிப்பும் இல்லை. சில வருடங்களுக்கு முன் வீட்டில் இருந்த செயின் ஒன்றை அடகு வைத்திருக்கிறார்கள். கடந்த வாரம் அதை மீட்டு எடுப்பதாகச் சொல்லி கடைசியாக வீட்டை விட்டுப் போனவர்தான் அவர். அதன் பிறகு கதை தலைகீழாக மாறி விட்டது. அடகுக் கடையில் இருந்து மீட்ட செயினை சட்டைப் பையிலோ வேறு எங்கே வேண்டுமானாலும் வைத்திருக்கலாம், என்ன நினைத்தாரோ என்னவோ, அதைக் கழுத்தில் அணிந்திருக்கிறார். கடையை விட்டு வெளியே வந்து ஒரு பத்து அடி கூட நடந்திருக்க மாட்டார், அதற்குள் அந்த செயினை பைக்கில் வந்த இரு முகமூடி அணிந்த கொள்ளையர்கள் பறித்துச் செல்ல முயன்றனர். அவர்கள் இழுத்ததில் இவர் கீழே விழுந்து இழுத்துச் செல்லப்பட்டிருக்கிறார். செயின் வராததால் அவர்கள் அதை இழுத்துப் பிடுங்க, செயின் அறுந்து அவரின் கழுத்து அறுபட்டு, அருகில் இருந்த மின் கம்பம் ஒன்றில் உருண்டு போய் தலையை இடித்திருக்கிறார். யோசித்துப் பாருங்கள், இவையெல்லாம் ஒரு சில நொடிகளில் நேர்ந்தவையாகும். அதன் பின் போலீஸ் விசாரணை, மருத்துவமனை என்று அலைச்சலுடன் இவரையும் இழந்து இன்று இருவரும் திக்கற்றுப் போயிருக்கிறார்கள். இப்போதும் அந்த விசாரணைக்காகவே அம்மா காவல் நிலையம் வரியும் போயிருக்கிறாள். 

      இதையெல்லாம் சொன்னபோது பல்லவி அழுகவில்லை. அந்த நிலை அழுகையைத் தாண்டிய விரக்தியாகவும் வாழ்க்கையின் மீது நம்பிக்கை இழந்த வெறுமையாகவும் இருந்தது. அது மஞ்சள் நிறம் தொலைத்த வெயிலைப் போலவும், வர்ணங்களை இழந்த வானவில்லைப் போலவும், இலையுதிர்காலத்து மரத்தைப் போலவும் காணப்பட்டது. எனக்குத் தெரியும், இந்த தனிதுவிடப்பட்ட பறவைதான் வானத்தின் மொத்த அமைதியை அளவிட போகிறது.

      அங்கிருந்து நாங்கள் கிளம்பியவுடன், வாசு என்னிடம் நிறைய புலம்பினான். கொஞ்சம் காதல், அதிகம் கண்ணீர். பல்லவி இந்த இன்னல்களைக் கடந்து இயல்பு நிலைக்குத் திரும்பி வாழ்வில் சீர்படும் வரை அவளிடம் காதலைச் சொல்லப் போவதில்லை என்றான். அவனின் அந்தப் புரிதலும் முடிவும் எனக்கு ஆச்சரியமாக இருந்தது.

      பல்லவி தேர்வுகளை மட்டும் வந்து எழுதிப் போனால், எல்லாரும் நினைத்தது போலவே அவள் மாநில அளவில் முதல் மதிப்பெண் எடுத்தாள், அதுவும் 99%. பள்ளிக் கட்டணத்தில் சலுகை மட்டுமில்லாது, மாவட்டம் மாநிலம் என்று அவளுக்கு நிறைய பரிசுகளும் உதவிகளும் கிடைத்தன. நாம் அனைத்தையும் இழந்து நிற்கும் தருணத்தில், கல்வி மட்டுமே நம்மைக் கைவிடாமல் அரணாக நின்று ஏதேனும் ஒரு வகையில் காக்கும் என்ற பேருண்மை எனக்குப் புரிந்தது. 'கேடில் விழுச்செல்வம் கல்வி' என்ற வள்ளுவன் வாக்கு எவ்வளவு சத்தியமானது! அவளுக்காக நாங்கள் அனைவரும் மகிழ்ந்தோம். ஆனால் அவளோ இன்னும் அதே வெறுமைடன்தான் இருந்தாள். முகத்தில் புன்னகை இருந்தாலும், அந்த இருளும் வெறுமையும் அவளை விட்டு நீங்கவில்லை. 

      மிஞ்சி இருந்த தங்க நகைகளை அடகு வைத்துக் கடன்களை அடைத்து, மீதம் இருந்த பணத்தில் ஒரு தையல் மிஷின் வாங்கி, அதைப் படிக்க தையல் வகுப்பிலும் சேர்ந்தார், பல்லவியின் தாய். ஒருபுறம் பல்லவி தன் கல்வியால் உயர, மறுபுறம் அவளது தாய் தையல் இயந்திரத்தை மிதித்து மிதித்துச் சிறுகச் சிறுகப் பணம் சேர்த்து இல்லறத்தின் பாரத்தைச் சுமந்து வந்தார். பெண்கள் இல்லாத என் வீட்டில் ஒரு பெரும் வெறுமை எப்போதும் படிந்திருக்கும். அந்தத் தராசைச் சமன் செய்ய நானும் என் தந்தையும் அல்லாடுவோம். ஆனால் பல்லவியின் வீட்டிலோ, அந்த வெறுமைக்கு இடமளிக்காமல், உழைப்பாலும் படிப்பாலும் அவர்கள் தங்கள் வாழ்க்கைத் தராசைச் சரியாகச் சமன் செய்தனர். வள்ளியும் சரி, பல்லவியும் சரி, பெண்கள் மீதும் சமூகத்தின் மீதும் படிந்துள்ள கண்ணுக்குத் தெரியாத நெருக்கடிகளை எனக்கு வாழ்வின் மூலம் சொல்லிக்கொடுத்தனர். ஒவ்வொரு பெண்ணின் வாழ்வைக் கடக்கும்போதும், இந்த உலகைப் புரிந்துகொள்வதற்கான புதிய சாளரங்கள் திறக்கப்படுகின்றன.

      நாட்கள் பறந்தன, பன்னிரண்டாம் வகுப்பிலும் பல்லவி சிறந்த மதிப்பெண்கள் பெற்றாள். பொறியியல் படிக்க ஆயத்தமானவள், JEE நுழைவுத் தேர்விலும் நல்ல தரவரிசையைப் பெற்றாள். அதைக் கொண்டு கலந்தாய்வில் பங்கேற்க, IIT கான்பூரில் அவளுக்கு இடம் கிடைத்தது. ஒரு செமஸ்டருக்கு பத்தாயிரம் ரூபாய் மட்டுமே கட்டணம் என்றாலும், கான்பூரில் தங்கிப் படிப்பதற்கும் போக்குவரத்திற்கும் பெரும் செலவாகும். அந்தச் செலவுகளை ஈடுகட்ட, கடந்த இரண்டு ஆண்டுகளாக அவளது அம்மா சிறுகச் சிறுகச் சேர்த்து வைத்திருந்த தங்கம் மீண்டும் அடகுக்கடைக்குப் போனது. ஒரு முறை அவளின் வாழ்வை அழித்த தங்கம், மறுமுறை அவளுக்கு வாழ்வளித்த தங்கம், இம்முறையும் அவளைக் காத்து உள்ளது. பெண்களின் வாழ்வில் தங்கம் என்பது ஓர் உலோகமல்ல; அது ஓர் அங்கம். அதுவே அவர்களுக்கான சாபமாகவும் வரமாகவும் இருக்கிறது. 

      தேர்வுகள் எல்லாம் முடிந்து அவள் கல்லூரிக்குப் புறப்படும் தருணத்தில், வாசு தன் காதலை அவளிடம் தெரியப்படுத்தினான். அதிகப் பட்சம் அவள் இந்தக் காதலை நிராகரிப்பாள் என்றே தோன்றியது. அவள் சொன்ன பதில் அதற்கும் மேலானதாக இருந்தது. பல்லவி நான்கு வருடங்களாக ஒருவனை காதலித்து இருக்கிறாள், அது வேறு யாருமில்லை எங்கள் வகுப்பில் இருந்த மாதவன்தான். ஆனால் யாருக்கும் தெரிந்திருக்கவில்லை, கிசுகிசுக்கள் கூட வந்தது இல்லை. எப்படி நான் பல்லவி யாரையும் காதலிக்க மாட்டாள் என்று நினைக்கலாம்? அவளும் பெண்தானே? அவள் படிப்பாள், அமைதியானவள் என்பதனால் அவள் யாரையும் காதலிக்க மாட்டாள் என்று நினைத்தது எனது மடத்தனத்தை குறிக்கிறது. வாசுவும் மிகவும் பாவம், இந்த இரண்டு மூன்று ஆண்டுகள் ஒரு தலையாக காதலித்து இந்த நிராகரிப்பை எப்படி எதிர்கொள்வானோ? அவள் நிராகரித்த ஒரு சில நாட்களில் அவன் கிட்டாங்குடி போய் விட்டான், சில மாதங்களுக்கு எனிடம் கூட அவன் பேசிக்கொள்வதையும் குறைத்துக் கொண்டான்.

      பல்லவி தன் கல்லூரிப் படிப்பைத் தொடர்ந்தாள். அவளது அம்மாவோ மூட்டு ஜவ்வு தேயத் தேயத் தையல் இயந்திரத்தை மிதித்து, அடகு வைத்த நகைகளைக் கொஞ்சம் கொஞ்சமாக மீட்டுவந்தார். ஆனால், எனக்கு நன்றாகத் தெரியும்; நாளை பல்லவியின் திருமணத்திற்கோ, அல்லது ஒரு சிறிய வீடு கட்டுவதற்கோ இந்தத் தங்கம் மீண்டும் அவர்களை விட்டுப் போகத்தான் போகிறது. அதுவரை வட்டி கணக்கைப் படிக்காமல், அந்தத் தங்கம் கொஞ்சம் தையல் கணக்கைப் படிக்கட்டும். ஆண்டுகள் உருண்டோடின. அவரவர் வாழ்க்கை ஓட்டத்தில் திசைக்கொன்றாய்ச் சிதறிப்போனதால், எல்லாவற்றையும் ஒருமித்துப் பேசவோ யோசிக்கவோ நேரமற்று, பல்லவியுடனான தொடர்பும் மெல்ல அறுந்துபோனது.  நான் எனது கல்லூரி நாட்களில் ஒரு IT நிறுவனத்தின் நேர்காணலுக்காக கான்பூர் வரை செல்ல வேண்டியிருந்தது. நேர்காணல் முடிந்த பின் பல்லவியை சந்திக்கலாம் என்று நினைத்தேன். அவளை தொடர்பு கொண்டு செய்தியை சொல்ல ஒரு காபி ஷாப்பில் இருவரும் சந்தித்துக் கொண்டோம். ஊர் நாயம் உள்ள நாயம் எல்லாம் பேசி நேரம் கடத்தினோம், அவள் வாசுவைப் பற்றி கேட்டாள், நானும் சொன்னேன், நான் மாதவனைப் பற்றி கேட்டேன், அவளும் தங்களின் காதலை முறித்துக் கொண்டதாகச் சொன்னாள். காரணம் மாதவன் ஒரு வசதியான வீட்டுப் பையன், இவர்களின் காதலைப் பற்றி அவன்தான் வீட்டில் சொன்னபோது அவர்கள் என்னதான் மற்ற ஜாதிப் பெண்ணாக இருந்தாலும் அவர்களின் அந்தஸ்துக்கு ஏதுவான பெண்ணைப் பார்க்க வேண்டும் என்று நினைத்திருக்கலாம், குறைந்தது ஒரு ஐம்பது சவரன் தங்கம் வரதட்சிணையாகக் கேட்டிருக்கிறார்கள். இப்படிப்பட்ட வீட்டில் திருமணம் செய்து கொள்ள மனமில்லாமல் பல்லவி காதலை முறித்துக் கொண்டாள். தங்கம் பல்லவியின் ஆசைகளை கொல்வது இது முதல் முறையன்று.

      இரண்டு வருடங்கள் கழித்து, எங்கள் பள்ளியின் வாட்ஸ்அப் குழுவில் ஒரு செய்தித்தாள் துணுக்கு பகிரப்பட்டது: "IIT கான்பூரில் தங்கப் பதக்கம் வென்ற தமிழக மாணவி." அதில் பல்லவியின் புகைப்படம். அதைப் பார்த்த கணத்தில் நான் உடைந்து அழுதுவிட்டேன். அவள் IAS ஆகவோ IPS ஆகவோ பெரிய பதவியில் அமர்த்தப்பட்டுவிடவில்லை. தமிழ்நாடு, இந்தியா என உலகையே புரட்டிப்போடும் சாதனைகளைச் செய்துவிடவுமில்லை. ஆண்டுதோறும் யாரோ ஒரு மாணவர் வாங்கும் அதே தங்கப் பதக்கத்தைத்தான் இம்முறை பல்லவி வாங்கியிருக்கிறாள். இதில் புதிதாக ஏதுமில்லை.    

      ஆனால், இதில் உள்ள ஆகப்பெரும் சிறப்பு என்னவென்றால். பல்லவியின் வாழ்வில் தங்கம் எப்போதுமே பிரிதலும் நோதலுமாகவே இருந்திருக்கிறது. ஆனால், இந்தத் தங்கத்தை, எந்த வறுமையாலும், எந்தக் காலத்தாலும், எந்தக் கடவுளாலும், ஏன் எந்தக் கொம்பனாலும் அவளிடமிருந்து திருப்பி வாங்கவே முடியாது!

      “செல்வத்துள் செல்வம் செவிச்செல்வம் அச்செல்வம் 
      செல்வத்துள் எல்லாம் தலை”
